# Workspace root (not a package). Two members:
#   server/  telco-mcp-server : the MCP server. The ONLY thing that ships (Dockerfile).
#   lab/     telco-mcp-lab    : local testing rig (mocks, harness, dev tools). Never ships.
[tool.uv.workspace]
members = ["server", "lab"]

[tool.uv.sources]
telco-mcp-server = { workspace = true }
telco-mcp-lab = { workspace = true }

[dependency-groups]
# `uv sync` (make setup) installs both members plus the test tools.
dev = [
    "telco-mcp-server",
    "telco-mcp-lab",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "security: tests that assert a security property (auth, scopes, IDs, masking, injection)",
    "slow: tests that deliberately wait (timeouts, delays)",
    "protocol: end-to-end MCP protocol tests over a real transport (stdio subprocess, HTTP)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server/src", "lab/src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["telco_mcp", "telco_mcp_lab", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"] # fake tokens / non-crypto random are fine in tests
