[project]
name = "telco-mcp-lab"
version = "0.2.0"
description = "Learning sandbox: a stateless MCP server over mock telecom APIs (mirrors a Spring AI production design)."
requires-python = ">=3.12,<3.13"
# Exact pins on purpose: this is a learning project, and we want everyone to see
# the same behaviour. uv.lock additionally pins every transitive dependency.
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "openai==3.19.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "security: tests that assert a security property (tenant isolation, scopes, injection)",
    "slow: tests that deliberately wait (timeouts, delays)",
    "protocol: end-to-end MCP protocol tests over a real transport (stdio subprocess, HTTP)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"] # fake tokens / non-crypto random are fine in tests
